<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>抗菌薬</title>

    <link rel="stylesheet" href="/Medical/css/styles.css">
    <link rel="stylesheet" href="/Medical/css/header.css">
    <link rel="stylesheet" href="/Medical/css/menu.css">
    <link rel="stylesheet" href="/Medical/css/search.css">
    <link rel="stylesheet" href="/Medical/css/footer.css">
    <link rel="manifest" href="/Medical/manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<div id="slideContainer" style="
    position: relative;
    text-align: center;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;">
    <img id="slideImage"
         src="/Medical/images/antibiotics/01.png"
         style="width: 100%;"
         draggable="false">
</div>
<p id="slideNumber" style="text-align: center;">1 / 5</p>

<h2>CCr（Cockcroft-Gault）</h2>
<calc>
<label>年齢</label><input type="number" id="age2"><br>
<label>体重 (kg)</label><input type="number" id="weightCCr"><br>
<label>血清Cr (mg/dL)</label><input type="number" id="cr2" step="0.01"><br>
<label>性別</label><select id="sex2">
    <option value="male">男性</option>
    <option value="female">女性</option>
</select>
<button onclick="calcCCr()">Calc</button><br>
<p id="ccrResult"></p>
</calc>

</main>
<div id="footer"></div>
<script src="/Medical/js/antibiotics.js"></script>
<script src="/Medical/js/loader.js"></script>
</body>
</html>
