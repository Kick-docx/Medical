<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>肝炎</title>

    <link rel="stylesheet" href="/Medical/css/styles.css">
    <link rel="stylesheet" href="/Medical/css/header.css">
    <link rel="stylesheet" href="/Medical/css/menu.css">
    <link rel="stylesheet" href="/Medical/css/search.css">
    <link rel="stylesheet" href="/Medical/css/footer.css">
    <link rel="manifest" href="/Medical/manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<h2>✔️B型肝炎</h2>

<p><strong>MELDスコア</strong>　肝移植待機患者の3ヶ月後死亡率</p>
<calc>
  <label for="meldBil">総ビリルビン（mg/dL）</label>
  <input type="number" id="meldBil" min="1" max="999.9" step="0.1" placeholder="T-Bil"><br>
  <label for="meldCr">クレアチニン（mg/dL）</label>
  <input type="number" id="meldCr" min="1" max="4" step="0.1" placeholder="Cr"><br>
  <label for="meldINR">PT-INR</label>
  <input type="number" id="meldINR" min="1" max="999.9" step="0.1" placeholder="INR"><br>
  <label><input type="checkbox" id="meldDialysis"></label><span>過去7日以内に2回以上の透析、または24時間以上のCVVHD</span><br>
  <button type="button" onclick="calculateMELD()">calc</button>
  <div id="meldResult" aria-live="polite" style="margin-top:20px;">
    <p>MELDスコア：－</p>
  </div>
</calc>

　<p><a href="/Medical/documents/Bhepa.pdf">B型肝炎ガイドライン</a></p>
<h2>✔️C型肝炎</h2>
　<p><a href="/Medical/documents/Chepa.pdf">C型肝炎ガイドライン</a></p>
<h2>✔️MASLD</h2>
　<p><a href="/Medical/documents/MASLD.pdf">MASLDガイドライン</a></p>
<h2>✔️薬剤性肝障害</h2>
  <p><strong>R値</strong></p>
  <calc>
    <label for="rALT">ALT実測値（U/L）</label>
    <input type="number" id="rALT" min="0" step="any" placeholder="ALT値"><br>
    <label for="rALTULN">ALT基準上限値（U/L）</label>
    <input type="number" id="rALTULN" min="0" step="any" placeholder="ALT基準上限値"><br>
    <label for="rALP">ALP実測値（U/L）</label>
    <input type="number" id="rALP" min="0" step="any" placeholder="ALP値"><br>
    <label for="rALPULN">ALP基準上限値（U/L）</label>
    <input type="number" id="rALPULN" min="0" step="any" placeholder="ALP基準上限値">
  <button type="button" onclick="calculateRValue()">calc</button>
  <div id="rResult" aria-live="polite" style="margin-top:20px;">
    <p>R値：－，肝障害パターン：－</p></div>
  </calc>


</main>
<div id="footer"></div>
<script src="/Medical/js/liver.js"></script>
<script src="/Medical/js/loader.js"></script>
</body>
</html>
