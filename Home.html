<h2><a href="documents/picture.pdf">画像診断</a></h2>
<br>

<p>ニカルジピン10mg10mL：生食に混注して計50mL（5倍希釈）→5mL/h（1mg/h）．血圧に応じて5mL/hずつ調整．Max25mL/h</p>
<p>ノルアドレナリンは0.05γから開始．</p>
<br>

<p><strong>持続点滴速度（γ計算）</strong>1γ=体重kgx0.06mg/hr</p>
<calc>
<label>薬剤量 (mg)</label>
<input type="number" id="drugMg"><br>
<label>総薬液量 (mL)</label>
<input type="number" id="totalMl"><br>
<label>体重 (kg)</label>
<input type="number" id="weightGamma"><br>
<label>目標γ (μg/kg/min)</label>
<input type="number" id="gamma" step="0.01">
<button onclick="calcGamma()">Calc</button><br>
<div id="gammaResult"></div>
</calc>
<br>

<p><strong>処方日数</strong></p>
<calc>
    <label for="dischargeDate">退院日</label>
    <input type="date" id="dischargeDate"><br>

    <label for="outpatientDate">次回外来日</label>
    <input type="date" id="outpatientDate"><br>

    <label for="remainingDays">残薬（日分）</label>
    <input type="number" id="remainingDays" min="0" step="1" value="0">
  <button type="button" onclick="calculatePrescriptionDays()">Calc</button>
  <p id="prescriptionResult" aria-live="polite">
    必要な処方日数：－日分
  </p>
</calc>
